<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商店服装</title>
    <style>
      body { margin: 0; background: #04202c; color: #f4f7f2; font-family: sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { color: #e8d48a; font-size: 28px; margin: 0 0 8px; }
      p.hint { color: rgba(244,247,242,.6); margin: 0 0 20px; }
      figure { margin: 0 0 22px; }
      img { width: 100%; background: #fff; border-radius: 22px; display: block; }
      figcaption { padding: 10px 4px 0; font-size: 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>商店新衣服</h1>
      <p class="hint">铜盔、蟹老板、熊猫已去掉。游戏里房子 → 服装兑换。</p>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/3.jpg" alt="骑士" />
        <figcaption>骑士 · 18 贝壳</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/5.jpg" alt="机甲" />
        <figcaption>机甲 · 20 贝壳</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/6.jpg" alt="蜜蜂" />
        <figcaption>蜜蜂 · 14 贝壳</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/7.jpg" alt="粉海星" />
        <figcaption>粉海星 · 16 贝壳</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/8.jpg" alt="海绵厨师" />
        <figcaption>海绵厨师 · 16 贝壳</figcaption>
      </figure>
    </main>
  </body>
</html>
