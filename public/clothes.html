<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>候选服装</title>
    <style>
      body { margin: 0; background: #04202c; color: #f4f7f2; font-family: sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { color: #e8d48a; font-size: 28px; margin: 0 0 8px; }
      p.hint { color: rgba(244,247,242,.6); margin: 0 0 20px; }
      figure { margin: 0 0 22px; }
      img { width: 100%; background: #fff; border-radius: 22px; display: block; }
      figcaption { padding: 10px 4px 0; font-size: 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1>候选服装</h1>
      <p class="hint">转给姐夫看，回编号就行。也可先看总图。</p>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/catalog.jpg" alt="候选服装总图" />
        <figcaption>总图</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/1.jpg" alt="1 铜盔潜水员" />
        <figcaption>1 铜盔潜水员</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/2.jpg" alt="2 蟹老板" />
        <figcaption>2 蟹老板</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/3.jpg" alt="3 骑士" />
        <figcaption>3 骑士</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/4.jpg" alt="4 熊猫" />
        <figcaption>4 熊猫</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/5.jpg" alt="5 机甲" />
        <figcaption>5 机甲</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/6.jpg" alt="6 蜜蜂" />
        <figcaption>6 蜜蜂</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/7.jpg" alt="7 粉海星" />
        <figcaption>7 粉海星</figcaption>
      </figure>
      <figure>
        <img src="https://zhangyu-roan.vercel.app/zhangyu/outfits/8.jpg" alt="8 海绵厨师" />
        <figcaption>8 海绵厨师</figcaption>
      </figure>
    </main>
  </body>
</html>
